# GitHub Actions workflow. Copy to .github/workflows/ci.yml to enable CI
# (it could not be pushed from the automated session, which lacks the "workflow" scope).
name: CI
on:
  push:
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Android API 10 platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-10" "platforms;android-34" > /dev/null
      - name: Build, unit test and lint
        run: ./gradlew assembleDebug :app:testDebugUnitTest :app:lintDebug :bridge-android:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            bridge-android/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: '*/build/reports'

  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Bridge tests
        working-directory: bridge
        run: python -m unittest -v test_bridge
